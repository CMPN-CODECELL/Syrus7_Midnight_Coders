services:
  postgres:
    image: postgres:16
    container_name: tradeshield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradeshield
      POSTGRES_PASSWORD: tradeshield
      POSTGRES_DB: tradeshield
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeshield"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
